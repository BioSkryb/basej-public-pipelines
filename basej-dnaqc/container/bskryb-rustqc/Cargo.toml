[package]
name = "bskryb-rustqc"
version = "0.1.5"
edition = "2021"
description = "Single-pass DNA QC metrics from BAM, a Rust rewrite of the Sentieon/Picard AlignmentStat + InsertSize metrics used by basej-dnaqc. Follows rewrites.bio principles."
license = "GPL-3.0-or-later"

[[bin]]
name = "bskryb-qc"
path = "src/main.rs"

[dependencies]
noodles-bam = "0.56"
noodles-sam = "0.53"
noodles-bgzf = "0.30"
noodles-core = "=0.14.0"
noodles-csi = "=0.30.0"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
